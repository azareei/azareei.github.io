---
layout: default
---

<div class="post">

  <header class="post-header">
    <h1 class="post-title" style=font-size:50px>
      {{ page.title }}
    </h1>
    <p class="desc">{{ page.description }}</p>
  </header>

  <article>
    <!-- 3D Model Section -->
    <div class="row mt-3 mb-4" style="text-align:center;">
      <div class="col-sm">
        <div id="threejs-container" class="z-depth-1" role="img" aria-label="Interactive 3D head scan of Amad Zareei" style="border-radius: 20px; width: 400px; height: 500px; margin: 0 auto; background: #f8f9fa;">
        </div>
        <div class="caption mt-2">
          <small>Interactive 3D Model - Drag to rotate, scroll to zoom</small>
        </div>
      </div>
    </div>

    <div class="clearfix">
      {{ content }}
    </div>
  </article>

  <!-- Include Three.js and related scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Three.js script to load the 3D head scan -->
  <script>
    const width = 400;
    const height = 500;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0); // Light gray background
    const camera = new THREE.PerspectiveCamera(35, width / height, 1, 5000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
    // The scan texture is sRGB; output in sRGB so skin tones are reproduced faithfully
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = true;
    renderer.toneMapping = THREE.NoToneMapping;
    document.getElementById('threejs-container').appendChild(renderer.domElement);
    renderer.domElement.style.borderRadius = '20px';
    renderer.domElement.style.overflow = 'hidden';

    // Studio-style lighting: the scan texture is fairly dark, so use a bright soft
    // ambient base plus key/fill/rim lights. All lights are neutral white to keep skin tones true.
    scene.add(new THREE.HemisphereLight(0xffffff, 0xf2f2f2, 5.0));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(1, 1.2, 2);
    camera.add(keyLight); // Lights follow the camera so the face is lit from any angle

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.4);
    fillLight.position.set(-1.5, 0.3, 1);
    camera.add(fillLight);

    const frontLight = new THREE.DirectionalLight(0xffffff, 1.2);
    frontLight.position.set(0, 0, 1);
    camera.add(frontLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
    rimLight.position.set(0, 1.5, -2); // Behind the head, separates it from the background
    camera.add(rimLight);
    scene.add(camera);

    // OrbitControls for camera interaction
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableDamping = true; // Smooth camera movement
    controls.dampingFactor = 0.05;

    const loader = new THREE.GLTFLoader();
    loader.load('{{ site.baseurl }}/assets/objs/model.glb', function (gltf) {
      const object = gltf.scene;

      object.traverse(function (child) {
        if (child.isMesh) {
          const map = child.material.map;
          if (map) {
            map.encoding = THREE.sRGBEncoding;
            map.anisotropy = renderer.capabilities.getMaxAnisotropy();
          }
          // Matte skin: no metalness, no glossy highlights
          child.material = new THREE.MeshStandardMaterial({
            map: map,
            roughness: 0.85,
            metalness: 0.0,
            side: THREE.DoubleSide
          });
        }
      });

      // Center the model at the origin
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      object.position.sub(center);
      scene.add(object);

      // Frame the head: three-quarter view from the front
      const radius = size.length() / 2;
      const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.8;
      camera.position.set(0.35, 0.15, 1).normalize().multiplyScalar(distance);
      controls.target.set(0, 0, 0);
      controls.minDistance = distance * 0.4;
      controls.maxDistance = distance * 2.5;
      controls.update();
    }, undefined, function (error) {
      console.error('Failed to load 3D model', error);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>

</div>
